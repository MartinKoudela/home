    <style>
        @font-face {
            font-family: "Archivo";
            src: url(/assets/archivo.woff2) format("woff2");
            font-weight: 400 700;
            font-stretch: 100% 125%;
            font-display: swap
        }

        @font-face {
            font-family: "Plex Mono";
            src: url(/assets/plex-mono-400.woff2) format("woff2");
            font-weight: 400;
            font-display: swap
        }

        :root {
            --ink: #ECECEF;
            --blood: #8E0E18;
            color-scheme: dark
        }

        *, *::before, *::after {
            box-sizing: border-box
        }

        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none
        }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
            background: #000
        }

        body {
            height: 100vh;
            height: 100dvh;
            display: grid;
            grid-template-rows: minmax(0, 1fr) auto;
            background: #000;
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent
        }

        #noise {
            position: fixed;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100vh;
            height: 100lvh;
            display: block;
            z-index: 0
        }

        #noise.off {
            background: #050505
        }

        .fx {
            position: fixed;
            pointer-events: none
        }

        #quotes {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            overflow: hidden;
            mix-blend-mode: screen
        }

        .quote {
            position: absolute;
            overflow: hidden;
            background: #000
        }

        .quote .frames {
            position: relative;
            will-change: transform, filter, opacity
        }

        .quote img {
            display: block;
            width: 100%;
            height: auto
        }

        .quote img + img {
            position: absolute;
            left: 0;
            top: 0
        }

        .quote i {
            position: absolute;
            inset: 0;
            background-image: var(--grain);
            background-size: 140px 140px;
            mix-blend-mode: multiply;
            opacity: 0
        }

        .grain {
            inset: -50%;
            z-index: 4;
            background-image: var(--grain);
            background-size: 220px 220px;
            opacity: .17;
            mix-blend-mode: overlay;
            animation: grain .42s steps(6) infinite
        }

        .vignette {
            inset: 0;
            z-index: 3;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0, 0, 0, .7) 100%)
        }

        @keyframes grain {
            0% {
                transform: translate(0, 0)
            }
            17% {
                transform: translate(-6%, 4%)
            }
            33% {
                transform: translate(4%, -7%)
            }
            50% {
                transform: translate(-8%, -2%)
            }
            67% {
                transform: translate(6%, 6%)
            }
            83% {
                transform: translate(-3%, 7%)
            }
            100% {
                transform: translate(0, 0)
            }
        }

        main, footer {
            position: relative;
            z-index: 5
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(22px, 6dvh, 52px);
            min-height: 0;
            padding: max(16px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) 8px max(20px, env(safe-area-inset-left));
            text-align: center
        }

        h1 {
            margin: 0;
            font-family: "Archivo", system-ui, sans-serif;
            font-weight: 640;
            font-stretch: 125%;
            font-size: max(32px, min(12.5vw, 15dvh, 136px));
            line-height: .86;
            letter-spacing: -.025em;
            color: var(--ink);
            text-shadow: 0 0 6px rgba(255, 255, 255, .22), 0 0 26px rgba(255, 255, 255, .07);
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            cursor: default
        }

        h1 span {
            display: block
        }

        h1.jolt {
            animation: jolt .3s steps(1) both
        }

        @keyframes jolt {
            0% {
                transform: translate(-3px, 1px) skewX(-6deg);
                text-shadow: -3px 0 rgba(142, 14, 24, .85), 2px 0 rgba(255, 255, 255, .3)
            }
            25% {
                transform: translate(2px, -1px);
                clip-path: inset(0 0 48% 0)
            }
            45% {
                transform: translate(-1px, 0) skewX(4deg);
                text-shadow: 2px 0 rgba(142, 14, 24, .7), -1px 0 rgba(255, 255, 255, .25);
                clip-path: none
            }
            70% {
                transform: translate(1px, 1px)
            }
            100% {
                transform: none
            }
        }

        nav ul {
            display: flex;
            justify-content: center;
            gap: clamp(6px, 2.4vw, 26px);
            margin: 0;
            padding: 0;
            list-style: none
        }

        nav a {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            color: var(--ink);
            opacity: .9;
            text-decoration: none;
            transition: color .25s, opacity .25s
        }

        nav svg {
            width: 26px;
            height: 26px;
            transition: filter .25s
        }

        nav span {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translate(-50%, -4px);
            font-family: "Plex Mono", ui-monospace, monospace;
            font-size: 10px;
            letter-spacing: .12em;
            text-transform: lowercase;
            white-space: nowrap;
            color: rgba(236, 236, 239, .72);
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s, transform .2s
        }

        nav a:hover, nav a:focus-visible {
            color: var(--blood);
            opacity: 1
        }

        nav a:hover svg, nav a:focus-visible svg {
            filter: drop-shadow(0 0 6px rgba(142, 14, 24, .7))
        }

        nav a:hover span, nav a:focus-visible span {
            opacity: 1;
            transform: translate(-50%, 0)
        }

        nav a:focus-visible {
            outline: 1px solid rgba(142, 14, 24, .8);
            outline-offset: 2px
        }

        footer {
            display: flex;
            justify-content: center;
            padding: 0 max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left))
        }

        .player {
            width: min(380px, 100%);
            padding: 6px;
            border-radius: 16px;
            background: rgba(0, 0, 0, .55);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06), 0 10px 40px -12px rgba(0, 0, 0, .9);
            -webkit-backdrop-filter: blur(6px);
            backdrop-filter: blur(6px)
        }

        .player iframe {
            display: block;
            width: 100%;
            height: 80px;
            border: 0;
            border-radius: 12px;
            background: transparent
        }

        #gate {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: grid;
            place-items: center;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            border: 0;
            background: rgba(0, 0, 0, .6);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
            color: var(--ink);
            font: 400 14px/1 "Plex Mono", ui-monospace, monospace;
            letter-spacing: .3em;
            text-transform: lowercase;
            cursor: pointer;
            transition: opacity .8s, visibility .8s
        }

        #gate span {
            text-shadow: 0 0 10px rgba(255, 255, 255, .35);
            transition: color .25s, text-shadow .25s
        }

        #gate:hover span, #gate:focus-visible span {
            color: #fff;
            text-shadow: 0 0 10px rgba(142, 14, 24, .9), 0 0 2px rgba(255, 255, 255, .6)
        }

        #gate:focus-visible {
            outline: none
        }

        .entered #gate {
            opacity: 0;
            visibility: hidden;
            pointer-events: none
        }

        main, footer {
            transition: opacity 1.1s .2s, transform 1.1s .2s
        }

        html:not(.entered) main, html:not(.entered) footer {
            opacity: 0;
            transform: scale(.97)
        }

        @media (max-height: 420px) {
            main {
                gap: 10px
            }

            footer {
                padding-bottom: max(8px, env(safe-area-inset-bottom))
            }

            nav a {
                height: 40px
            }
        }

        @media (max-width: 359.98px) {
            nav ul {
                gap: 2px
            }

            nav a {
                width: 44px
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important
            }
        }
    </style>
</head>
